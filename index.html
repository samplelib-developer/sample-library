<!DOCTYPE html>

<html lang = "en">
  
  <head>

    <!--so I can use common symbols + linking HTML to CSS for design purposes-->
    <meta charset = "UTF-8">
    <title>Sample Library</title>
    <link rel = "stylesheet" href = "design.css">

  </head>


  <body>

    <!--Heading + dropzone + establishing errors (though they wont be visible all the time)-->
    <h1> Sample Library </h1>

    <div id = "errors"></div>
    <div id = "drop_zone">Drag and drop WAV/MP3 samples here</div>



    <!--filtering and searching features-->
    <div id="controls">
      <input type="search" id="searchbox" placeholder="Search by name">

      <select id="filter_soundtype"><option value="">All types</option></select>
      <select id="filter_category"><option value="">All categories</option></select>
      <select id="filter_genre"><option value="">All genres</option></select>
      <select id="filter_key"><option value="">All keys</option></select>

      <input type="number" id="bpm_min" placeholder="BPM min" min="20" max="300">
      <input type="number" id="bpm_max" placeholder="BPM max" min="20" max="300">

      <button id="clear_filters">Clear filters</button>
    </div>




    <!--This table is where all the users metadata is-->
    <table id = "main_lib">
      <thead>
        <tr>
          <th> Name </th>
          <th> Type </th>
          <th> Category </th>
          <th> Genre </th>
          <th> Key </th>
          <th> BPM </th>
          <th> Length </th>
          <th> Added </th>
          <th> Actions </th>
        </tr>
      </thead>
      <tbody id = "lib_body"></tbody>
    </table>

    <p id="no_matches" hidden>No samples match your search.</p>




    <!-- editing metadata (reminder for me, p=paragraph, h2=header type 2) -->
        <div id="edit_form" hidden>
          <h2>edit sample <span id="edit_title"></span></h2>
          <p id="edit_info"></p>
    
          <p><label for="edit_soundtype">Sound type</label>
             <select id="edit_soundtype"><option value="">—</option></select></p>
    
          <p><label for="edit_category">Category</label>
             <select id="edit_category"><option value="">—</option></select></p>
    
          <p><label for="edit_genre">Genre</label>
             <select id="edit_genre"><option value="">—</option></select></p>
    
          <p><label for="edit_key">Key</label>
             <select id="edit_key"><option value="">—</option></select></p>
    
          <p><label for="edit_bpm">BPM</label>
             <input type="number" id="edit_bpm" min="20" max="300" step="1"></p>
    
          <p id="bpm_error"></p>
          <button id="edit_cancel">Cancel</button>
          <button id="edit_save">Save</button>
        </div>


     <!--link to javascripts for later usage (basically means I can call a function from one script in the other, treating them as one)-->
    <script src = "db.js"></script>
    <script src = "app.js"></script>
    <script src="howler.min.js"></script>
  </body>


</html>
